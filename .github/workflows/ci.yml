name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  UV_MALWARE_CHECK: "1"
  UV_VERSION: "0.11.31"

jobs:
  quality:
    name: Quality, Rust, and artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4.7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      VAULTLET_TEST_REDIS_ENDPOINT: redis://127.0.0.1:6379/0
      VAULTLET_TEST_REDIS_USERNAME: vaultlet-ci
      VAULTLET_TEST_REDIS_PASSWORD: vaultlet-ci-password
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --dev

      - name: Enable Redis AOF durability
        run: |
          docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET appendfsync always
          docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET appendonly yes
          docker exec "${{ job.services.redis.id }}" redis-cli ACL SETUSER vaultlet-ci on \
            '>vaultlet-ci-password' '~vaultlet:*' '+@all'

      - name: Run complete package gate
        run: make check

      - name: Run Redis backend contract
        run: >-
          cargo test --manifest-path rust/Cargo.toml --all-features
          redis_backend_obeys_contract_and_reopens -- --ignored

      - name: Run benchmark correctness smoke
        run: uv run python benchmarks/smoke.py

  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -v

  musllinux:
    name: Musllinux wheel / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build musllinux stable-ABI wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: musllinux_1_2
          rust-toolchain: "1.89.0"
          sccache: true

      - name: Install and smoke-test wheel in Alpine
        run: |
          docker run --rm --volume "$PWD:/io:ro" python:3.12-alpine sh -euxc '
            python -m venv /tmp/wheel-smoke
            /tmp/wheel-smoke/bin/python -m pip install /io/dist/*.whl
            /tmp/wheel-smoke/bin/python -I /io/scripts/release_smoke.py
          '

  rust-security:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal

      - name: Install security tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked

      - name: Audit Cargo lock
        run: cargo audit --file rust/Cargo.lock

      - name: Check dependency policy
        run: cargo deny --manifest-path rust/Cargo.toml check

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  codeql:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: rust
            build-mode: manual
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        if: matrix.language == 'rust'
        run: rustup toolchain install 1.89.0 --profile minimal

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build native core for analysis
        if: matrix.language == 'rust'
        run: cargo build --manifest-path rust/Cargo.toml --all-features

      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
