name: Publish to PyPI

on:
  release:
    types:
      - published

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  UV_MALWARE_CHECK: "1"
  UV_VERSION: "0.11.31"

jobs:
  quality:
    name: Verify release commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt

      - name: Set up uv and Python without a dependency cache
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --dev

      - name: Run complete package gate
        run: make check

  wheels:
    name: Wheel / ${{ matrix.target }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            musl: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build native stable-ABI wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: "1.89.0"
          sccache: false

      - name: Smoke-test native wheel
        if: matrix.musl != true
        shell: bash
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl || wheel-smoke/Scripts/python.exe -m pip install dist/*.whl
          PYTHON_BIN="wheel-smoke/bin/python"
          if [ ! -x "$PYTHON_BIN" ]; then PYTHON_BIN="wheel-smoke/Scripts/python.exe"; fi
          "$PYTHON_BIN" -I scripts/release_smoke.py

      - name: Install and smoke-test musllinux wheel in Alpine
        if: matrix.musl == true
        run: |
          docker run --rm --volume "$PWD:/io:ro" python:3.12-alpine sh -euxc '
            python -m venv /tmp/wheel-smoke
            /tmp/wheel-smoke/bin/python -m pip install /io/dist/*.whl
            /tmp/wheel-smoke/bin/python -I /io/scripts/release_smoke.py
          '

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  sdist:
    name: Source distribution
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
          rust-toolchain: "1.89.0"

      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  validate:
    name: Validate release set
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: false

      - name: Install locked validation tools
        run: uv sync --dev --no-install-project

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Match release tag to package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          package = tomllib.loads(Path("rust/Cargo.toml").read_text())["package"]
          expected = f"v{package['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Release tag {actual!r} must equal {expected!r}")
          PY

      - name: Validate metadata and artifact set
        run: |
          uv run --no-sync twine check dist/*
          test "$(find dist -name '*.whl' | wc -l)" -eq 7
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 1

      - name: Upload validated release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish with trusted credentials
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/vaultlet
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-python-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist/
