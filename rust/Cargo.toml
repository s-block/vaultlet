[package]
name = "vaultlet-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Private Rust core for the Vaultlet Python package"
repository = "https://github.com/s-block/vaultlet"
publish = false
include = ["Cargo.lock", "Cargo.toml", "benches/**/*.rs", "src/**/*.rs"]

[lib]
name = "_vaultlet"
crate-type = ["cdylib", "rlib"]

[dependencies]
arc-swap = "1.9.2"
async-trait = "0.1.92"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
libc = "0.2.189"
pyo3 = { version = "0.29.2", features = ["abi3-py312"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
rayon = "1.11.0"
redb = "4.1.0"
redis = { version = "1.5.0", default-features = false, features = ["connection-manager", "script", "tls-rustls-webpki-roots", "tokio-rustls-comp"] }
rmp = "0.8.15"
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache"] }
sha2 = { version = "0.11.0", features = ["zeroize"] }
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
criterion = "0.7.0"
tempfile = "3.23.0"

[[bench]]
name = "core"
harness = false

[lints.rust]
unsafe_code = "forbid"
